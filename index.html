<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T.A.S.K. — Test Animation Site Kuz</title>
    <style>
        /* Стильный хакерский дизайн: глубокий черный и неоново-зеленый */
        body {
            background-color: #050505;
            color: #a5a5a5;
            font-family: 'Consolas', 'Courier New', Courier, monospace; /* Шрифт кода для стиля */
            margin: 0;
            padding: 40px;
        }

        header {
            border-left: 4px solid #00ff66; /* Зеленый акцент */
            padding-left: 20px;
            margin-bottom: 50px;
        }

        h1 {
            color: #ffffff;
            margin: 0;
            font-size: 36px;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        .subtitle {
            color: #00ff66; /* Зеленый текст подзаголовка */
            margin: 8px 0 0 0;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Крупная сетка для больших превью */
        .animation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); /* Увеличили минимальный размер */
            gap: 40px; /* Больше пространства между карточками */
            padding: 20px 0;
        }

        /* Стиль большой карточки анимации */
        .anim-card {
            background: #111111;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        border-color 0.3s ease, 
                        box-shadow 0.3s ease;
            border: 1px solid #1a1a1a;
            position: relative;
        }

        /* Эффект сильного увеличения при наведении */
        .anim-card:hover {
            transform: scale(1.1); /* Заметное увеличение */
            border-color: #00ff66; /* Подсветка зеленым */
            box-shadow: 0 20px 40px rgba(0, 255, 102, 0.25); /* Зеленое свечение */
            z-index: 99; /* Выталкивает карточку на передний план над остальными */
        }

        /* Контейнер для видео 16:9 */
        .video-box {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; 
            background: #000;
        }

        /* Настройки видео */
        .video-box video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        /* Информация о рендере */
        .anim-info {
            padding: 22px;
            background: #0d0d0d;
        }

        .anim-title {
            color: #ffffff;
            font-size: 18px;
            margin: 0 0 12px 0;
            font-weight: bold;
        }

        .anim-meta {
            font-size: 13px;
            color: #666666;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .anim-duration {
            background: #1a1a1a;
            color: #00ff66;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            border: 1px solid rgba(0, 255, 102, 0.2);
        }

        /* Сообщение о загрузке */
        #loading {
            color: #00ff66;
            font-size: 18px;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>T.A.S.K.</h1>
        <div class="subtitle">Test Animation Site Kuz</div>
    </header>

    <main>
        <div id="loading">Сканирование папки с рендерами...</div>
        <div class="animation-grid" id="grid"></div>
    </main>

    <script>
        // НАСТРОЙКА АВТОМАТИЗАЦИИ:
        // Укажите здесь ваш точный ник на GitHub и название репозитория
        const githubUser = "vladkuznetsow1324-oss";
        const repoName = "Task"; 

        const grid = document.getElementById('grid');
        const loadingText = document.getElementById('loading');

        // Функция автоматического считывания папки через GitHub API
        async function loadVideosAutomatically() {
            try {
                const response = await fetch(`https://api.github.com/repos/${githubUser}/${repoName}/contents/videos`);
                if (!response.ok) throw new Error("Не удалось прочитать папку videos");
                
                const files = await response.json();
                
                // Фильтруем только файлы .mp4
                const videoFiles = files.filter(file => file.name.endsWith('.mp4'));
                
                if (videoFiles.length === 0) {
                    loadingText.innerText = "Папка videos пуста. Загрузите туда файлы, например, 0001.mp4";
                    return;
                }

                loadingText.style.display = 'none'; // Скрываем надпись загрузки

                // Создаем карточку для каждого найденного видео
                videoFiles.forEach(file => {
                    // Извлекаем имя без расширения (например, "0001")
                    const videoNumber = file.name.replace('.mp4', ''); 
                    
                    const card = document.createElement('div');
                    card.className = 'anim-card';
                    card.innerHTML = `
                        <div class="video-box">
                            <!-- Убрали muted, чтобы был звук -->
                            <video loop playsinline preload="metadata">
                                <source src="${file.path}" type="video/mp4">
                            </video>
                        </div>
                        <div class="anim-info">
                            <h3 class="anim-title">Рендер #${videoNumber}</h3>
                            <div class="anim-meta">
                                <span class="anim-duration" id="dur-${videoNumber}">Замер...</span>
                                <span>Blender Render</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);

                    // Автоматически определяем длину видео, когда оно подгрузится
                    const videoEl = card.querySelector('video');
                    videoEl.addEventListener('loadedmetadata', () => {
                        const duration = Math.round(videoEl.duration);
                        document.getElementById(`dur-${videoNumber}`).innerText = duration + 'с';
                    });
                });

                // Вешаем события мыши на динамически созданные видео
                initVideoHover();

            } catch (error) {
                loadingText.innerText = "Ошибка автоматизации. Проверьте имя папки 'videos'.";
                console.error(error);
            }
        }

        // Логика воспроизведения со звуком при наведении
        function initVideoHover() {
            const videos = document.querySelectorAll('video');
            videos.forEach(video => {
                video.addEventListener('mouseenter', () => {
                    video.muted = false; // Звук включен!
                    video.play().catch(err => console.log("Браузер заблокировал автозвук до первого клика по сайту"));
                });
                video.addEventListener('mouseleave', () => {
                    video.pause();
                    video.currentTime = 0;
                });
            });
        }

        // Запуск системы
        loadVideosAutomatically();
    </script>
</body>
</html>
