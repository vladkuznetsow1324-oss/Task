<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T.A.S.K. — Test Animation Site Kuz</title>
    <style>
        /* Фирменный стиль T.A.S.K. (киберпанк-минимализм) */
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 30px;
        }

        header {
            border-left: 4px solid #463077; /* Фиолетовый акцент */
            padding-left: 20px;
            margin-bottom: 40px;
        }

        h1 {
            color: #ffffff;
            margin: 0;
            font-size: 28px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #66fcf1; /* Бирюзовый акцент */
            margin: 5px 0 0 0;
            font-size: 14px;
            text-transform: uppercase;
        }

        /* Наша кастомная сетка для коротких рендеров */
        .animation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* Стиль карточки анимации */
        .anim-card {
            background: #1f2833;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            border: 1px solid #2f3e46;
        }

        /* Эффект при наведении на карточку */
        .anim-card:hover {
            transform: translateY(-5px);
            border-color: #66fcf1;
            box-shadow: 0 10px 20px rgba(102, 252, 241, 0.2);
        }

        /* Контейнер для видео под размер 640x360 (соотношение 16:9) */
        .video-box {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; 
            background: #000;
        }

        /* Настройки нашего видеоплеера */
        .video-box video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Видео аккуратно заполнит карточку */
            cursor: pointer;
        }

        /* Информация о рендере */
        .anim-info {
            padding: 15px;
        }

        .anim-title {
            color: #ffffff;
            font-size: 16px;
            margin: 0 0 8px 0;
        }

        .anim-meta {
            font-size: 12px;
            color: #858585;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <header>
        <h1>T.A.S.K.</h1>
        <div class="subtitle">Test Animation Site Kuz // Лаборатория 3D-анимации</div>
    </header>

    <main>
        <div class="animation-grid">

            <!-- КАРТОЧКА АНИМАЦИИ 1 -->
            <div class="anim-card">
                <div class="video-box">
                    <!-- loop делает видео бесконечным, muted позволяет запускать автоматически -->
                    <video loop muted controls poster="videos/preview1.jpg">
                        <source src="videos/render1.mp4" type="video/mp4">
                        Ваш браузер не поддерживает видео.
                    </video>
                </div>
                <div class="anim-info">
                    <h3 class="anim-title">01. Первая проба физики</h3>
                    <div class="anim-meta">
                        <span>Длительность: 4с</span>
                        <span>Цикличный рендер</span>
                    </div>
                </div>
            </div>

            <!-- КАРТОЧКА АНИМАЦИИ 2 -->
            <div class="anim-card">
                <div class="video-box">
                    <video loop muted controls>
                        <source src="videos/render2.mp4" type="video/mp4">
                        Ваш браузер не поддерживает видео.
                    </video>
                </div>
                <div class="anim-info">
                    <h3 class="anim-title">02. Тест камеры и света</h3>
                    <div class="anim-meta">
                        <span>Длительность: 8с</span>
                        <span>Cycles 360p</span>
                    </div>
                </div>
            </div>

            <!-- Добавляйте новые карточки ниже по этому же шаблону -->

        </div>
    </main>

    <script>
        // Небольшой скрипт для интерактива: 
        // Видео начинает играть само при наведении мышки, и встает на паузу, когда мышку убирают.
        const videos = document.querySelectorAll('video');
        
        videos.forEach(video => {
            video.addEventListener('mouseenter', () => {
                video.play();
            });
            video.addEventListener('mouseleave', () => {
                video.pause();
                video.currentTime = 0; // Сбрасывает на начало, как гифку
            });
        });
    </script>
</body>
</html>
