<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T.A.S.K. — Test Animation Site Kuz</title>
    <style>
        /* Стильный хакерский дизайн: глубокий черный и неоново-зеленый */
        body {
            background-color: #050505;
            color: #a5a5a5;
            font-family: 'Consolas', 'Courier New', Courier, monospace;
            margin: 0;
            padding: 40px;
        }

        header {
            border-left: 4px solid #00ff66;
            padding-left: 20px;
            margin-bottom: 50px;
        }

        h1 {
            color: #ffffff;
            margin: 0;
            font-size: 36px;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        .subtitle {
            color: #00ff66;
            margin: 8px 0 0 0;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Крупная сетка для больших превью */
        .animation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 40px;
            padding: 20px 0;
        }

        /* Стиль большой карточки анимации */
        .anim-card {
            background: #111111;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        border-color 0.3s ease, 
                        box-shadow 0.3s ease;
            border: 1px solid #1a1a1a;
            position: relative;
        }

        /* Эффект сильного увеличения при наведении */
        .anim-card:hover {
            transform: scale(1.1);
            border-color: #00ff66;
            box-shadow: 0 20px 40px rgba(0, 255, 102, 0.25);
            z-index: 99;
        }

        /* Контейнер для видео 16:9 */
        .video-box {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; 
            background: #000;
        }

        /* Настройки видео */
        .video-box video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        /* Информация о рендере */
        .anim-info {
            padding: 22px;
            background: #0d0d0d;
        }

        .anim-title {
            color: #ffffff;
            font-size: 18px;
            margin: 0 0 12px 0;
            font-weight: bold;
            line-height: 1.4;
        }

        .anim-meta {
            font-size: 13px;
            color: #666666;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .anim-duration {
            background: #1a1a1a;
            color: #00ff66;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            border: 1px solid rgba(0, 255, 102, 0.2);
        }
    </style>
</head>
<body>

    <header>
        <h1>T.A.S.K.</h1>
        <div class="subtitle">Test Animation Site Kuz</div>
    </header>

    <main>
        <div class="animation-grid" id="grid"></div>
    </main>

    <script>
        // СПИСОК ВАШИХ ВИДЕО:
        // Просто пишите сюда точные названия файлов из папки videos (можно с пробелами)
        const myVideos = [
            "0001 Физика сферы.mp4",
            "0002 Падение кирпичей.mp4",
            "0003 Старый монитор.mp4"
        ];

        const grid = document.getElementById('grid');

        // Создаем карточки на основе списка
        myVideos.forEach((fileName, index) => {
            // Просто убираем .mp4 в конце, чтобы получить чистый заголовок карточки
            const cleanTitle = fileName.replace('.mp4', '');
            // Создаем уникальный ID для таймера секунд
            const timerId = `dur-${index}`;
            
            const card = document.createElement('div');
            card.className = 'anim-card';
            card.innerHTML = `
                <div class="video-box">
                    <video loop playsinline preload="auto">
                        <source src="videos/${fileName}" type="video/mp4">
                    </video>
                </div>
                <div class="anim-info">
                    <h3 class="anim-title">
                        <span style="color: #00ff66;">#</span>${cleanTitle}
                    </h3>
                    <div class="anim-meta">
                        <span class="anim-duration" id="${timerId}">0с</span>
                        <span>Blender Render</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);

            // Надежный замер длительности видео
            const videoEl = card.querySelector('video');
            
            function setDuration() {
                if (videoEl.duration) {
                    const duration = Math.round(videoEl.duration);
                    document.getElementById(timerId).innerText = duration + 'с';
                }
            }

            // Проверяем, если данные уже загружены, или ждем их загрузки
            if (videoEl.readyState >= 1) {
                setDuration();
            } else {
                videoEl.addEventListener('loadedmetadata', setDuration);
            }
        });

        // Запуск видео со звуком при наведении
        const videos = document.querySelectorAll('video');
        videos.forEach(video => {
            video.addEventListener('mouseenter', () => {
                video.muted = false;
                video.play().catch(err => console.log("Нужен клик на странице для активации звука"));
            });
            video.addEventListener('mouseleave', () => {
                video.pause();
                video.currentTime = 0;
            });
        });
    </script>
</body>
</html>
