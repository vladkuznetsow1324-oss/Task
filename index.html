    <script>
        const githubUser = "vladkuznetsow1324-oss";
        const repoName = "Task"; 

        const grid = document.getElementById('grid');
        const loadingText = document.getElementById('loading');

        // Функция для красивой обработки названий файлов
        function parseFileName(fileName) {
            const fileNameWithoutExt = fileName.replace('.mp4', ''); 
            const underscoreIndex = fileNameWithoutExt.indexOf('_');
            
            let videoNumber = fileNameWithoutExt;
            let videoTitle = "Новый рендер";

            if (underscoreIndex !== -1) {
                videoNumber = fileNameWithoutExt.substring(0, underscoreIndex);
                videoTitle = fileNameWithoutExt.substring(underscoreIndex + 1);
            }
            return { number: videoNumber, title: videoTitle };
        }

        // Функция создания карточки на экране
        function createVideoCard(videoNum, videoTitle, videoPath) {
            const card = document.createElement('div');
            card.className = 'anim-card';
            card.innerHTML = `
                <div class="video-box">
                    <video loop playsinline preload="metadata">
                        <source src="${videoPath}" type="video/mp4">
                    </video>
                </div>
                <div class="anim-info">
                    <h3 class="anim-title">
                        <span style="color: #00ff66; font-weight: normal; margin-right: 5px;">#${videoNum}</span> 
                        ${videoTitle}
                    </h3>
                    <div class="anim-meta">
                        <span class="anim-duration" id="dur-${videoNum}">Замер...</span>
                        <span>Blender Render</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);

            const videoEl = card.querySelector('video');
            videoEl.addEventListener('loadedmetadata', () => {
                const duration = Math.round(videoEl.duration);
                document.getElementById(`dur-${videoNum}`).innerText = duration + 'с';
            });
        }

        // Основная логика автоматизации
        async function loadVideosAutomatically() {
            try {
                // Добавляем случайное число к запросу, чтобы GitHub не выдавал старый кэш с ошибкой
                const response = await fetch(`https://github.com{githubUser}/${repoName}/contents/videos?nocache=${Date.now()}`);
                
                if (!response.ok) throw new Error("API временно недоступен");
                
                const files = await response.json();
                const videoFiles = files.filter(file => file.name.endsWith('.mp4'));
                
                if (videoFiles.length === 0) {
                    loadingText.innerText = "Папка videos пуста.";
                    return;
                }

                loadingText.style.display = 'none';

                videoFiles.forEach(file => {
                    const videoData = parseFileName(file.name);
                    createVideoCard(videoData.number, videoData.title, file.path);
                });

                initVideoHover();

            } catch (error) {
                console.log("GitHub API отдыхает, включаем резервный план...", error);
                
                // РЕЗЕРВНЫЙ ПЛАН: Если API упал, мы просто вручную пропишем файлы, которые вы переименовали.
                // Замените имена ниже на те, которые вы РЕАЛЬНО дали файлам в папке videos!
                const myBackupFiles = [
                    "0001_Физика сферы.mp4",
                    "0002_Падение кирпичей.mp4",
                    "0003_Старый монитор.mp4"
                ];

                loadingText.style.display = 'none';
                
                myBackupFiles.forEach(fileName => {
                    const videoData = parseFileName(fileName);
                    createVideoCard(videoData.number, videoData.title, `videos/${fileName}`);
                });

                initVideoHover();
            }
        }

        function initVideoHover() {
            const videos = document.querySelectorAll('video');
            videos.forEach(video => {
                video.addEventListener('mouseenter', () => {
                    video.muted = false;
                    video.play().catch(err => console.log("Ждем клика для звука"));
                });
                video.addEventListener('mouseleave', () => {
                    video.pause();
                    video.currentTime = 0;
                });
            });
        }

        loadVideosAutomatically();
    </script>
