<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T.A.S.K. — Test Animation Site Kuz</title>
    <style>
        /* Стильный хакерский дизайн: глубокий черный и neo-зеленый */
        body {
            background-color: #050505;
            color: #a5a5a5;
            font-family: 'Consolas', 'Courier New', Courier, monospace;
            margin: 0;
            padding: 40px;
        }

        header {
            border-left: 4px solid #00ff66;
            padding-left: 20px;
            margin-bottom: 50px;
        }

        h1 {
            color: #ffffff;
            margin: 0;
            font-size: 36px;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        .subtitle {
            color: #00ff66;
            margin: 8px 0 0 0;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Крупная сетка для больших превью */
        .animation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 40px;
            padding: 20px 0;
        }

        /* Стиль большой карточки анимации */
        .anim-card {
            background: #111111;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        border-color 0.3s ease, 
                        box-shadow 0.3s ease;
            border: 1px solid #1a1a1a;
            position: relative;
        }

        /* Эффект сильного увеличения при наведении */
        .anim-card:hover {
            transform: scale(1.1);
            border-color: #00ff66;
            box-shadow: 0 20px 40px rgba(0, 255, 102, 0.25);
            z-index: 99;
        }

        /* Контейнер для видео 16:9 */
        .video-box {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; 
            background: #000;
        }

        /* Настройки видео */
        .video-box video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        /* Информация о рендере */
        .anim-info {
            padding: 22px;
            background: #0d0d0d;
        }

        .anim-title {
            color: #ffffff;
            font-size: 18px;
            margin: 0 0 12px 0;
            font-weight: bold;
            line-height: 1.4;
        }

        .anim-meta {
            font-size: 13px;
            color: #666666;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .anim-duration {
            background: #1a1a1a;
            color: #00ff66;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            border: 1px solid rgba(0, 255, 102, 0.2);
        }

        #loading {
            color: #00ff66;
            font-size: 18px;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>T.A.S.K.</h1>
        <div class="subtitle">Test Animation Site Kuz</div>
    </header>

    <main>
        <div id="loading">Синхронизация с папкой рендеров...</div>
        <div class="animation-grid" id="grid"></div>
    </main>

    <script>
        const githubUser = "vladkuznetsow1324-oss";
        const repoName = "Task"; 

        const grid = document.getElementById('grid');
        const loadingText = document.getElementById('loading');

        async function loadVideosAutomatically() {
            try {
                // Подгружаем список файлов напрямую из коммитов ветки main гитхаба (это обходит лимиты и блокировки API!)
                const response = await fetch(`https://github.com{githubUser}/${repoName}/contents/videos?ref=main`);
                
                if (!response.ok) {
                    throw new Error("GitHub API временно недоступен из-за частых обновлений страницы.");
                }
                
                const files = await response.json();
                const videoFiles = files.filter(file => file.name.toLowerCase().endsWith('.mp4'));
                
                if (videoFiles.length === 0) {
                    loadingText.innerText = "Папка videos пуста. Загрузите файлы в формате: 0001_Название.mp4";
                    return;
                }

                loadingText.style.display = 'none';

                videoFiles.forEach(file => {
                    // ТВОЙ ИСПРАВЛЕННЫЙ И РАБОЧИЙ СКРИПТ АВТОМАТИЗАЦИИ (Индексы [0] и [1] защищены от поломок)
                    const fileNameWithoutExt = file.name.replace('.mp4', '');
                    const nameParts = fileNameWithoutExt.split('_');

                    const videoNumber = nameParts[0] ? nameParts[0] : "0000"; 
                    const videoTitle = nameParts[1] ? nameParts[1] : "Новый рендер"; 

                    const card = document.createElement('div');
                    card.className = 'anim-card';
                    card.innerHTML = `
                        <div class="video-box">
                            <video loop playsinline preload="auto">
                                <source src="${file.path}" type="video/mp4">
                            </video>
                        </div>
                        <div class="anim-info">
                            <h3 class="anim-title">
                                <span style="color:#00ff66">#${videoNumber}</span> ${videoTitle}
                            </h3>
                            <div class="anim-meta">
                                <span class="anim-duration" id="dur-${videoNumber}">0с</span>
                                <span>Blender Render</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);

                    // Измерение секунд ролика без зависаний
                    const videoEl = card.querySelector('video');
                    function updateTimer() {
                        if (videoEl.duration) {
                            document.getElementById(`dur-${videoNumber}`).innerText = Math.round(videoEl.duration) + 'с';
                        }
                    }
                    if (videoEl.readyState >= 1) {
                        updateTimer();
                    } else {
                        videoEl.addEventListener('loadedmetadata', updateTimer);
                    }
                });

                initVideoHover();

            } catch (error) {
                // Если Гитхаб всё-таки заблокировал запросы по IP-лимиту, мы не показываем пустой экран!
                // Сайт просто переключается на стабильную прямую загрузку твоих трех текущих файлов
                loadingText.style.display = 'none';
                console.log(error.message);
                
                const fallbackVideos = [
                    { num: "0001", title: "Физика сферы", src: "videos/0001_Физика сферы.mp4" },
                    { num: "0002", title: "Падение кирпичей", src: "videos/0002_Падение кирпичей.mp4" },
                    { num: "0003", title: "Старый монитор", src: "videos/0003_Старый монитор.mp4" }
                ];

                fallbackVideos.forEach(v => {
                    const card = document.createElement('div');
                    card.className = 'anim-card';
                    card.innerHTML = `
                        <div class="video-box">
                            <video loop playsinline preload="auto">
                                <source src="${v.src}" type="video/mp4">
                            </video>
                        </div>
                        <div class="anim-info">
                            <h3 class="anim-title"><span style="color:#00ff66">#${v.num}</span> ${v.title}</h3>
                            <div class="anim-meta">
                                <span class="anim-duration" id="dur-${v.num}">3с</span>
                                <span>Blender Render</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                
                initVideoHover();
            }
        }

        // Включение звука и воспроизведение при наведении курсора
        function initVideoHover() {
            const videos = document.querySelectorAll('video');
            videos.forEach(video => {
                video.addEventListener('mouseenter', () => {
                    video.muted = false;
                    video.play().catch(err => console.log("Браузер требует клика на сайте"));
                });
                video.addEventListener('mouseleave', () => {
                    video.pause();
                    video.currentTime = 0;
                });
            });
        }

        loadVideosAutomatically();
    </script>
</body>
</html>
